name: gps_camera_app
description: "A production-ready Flutter GPS Map Camera application with real-time sensors, geo-stamping, and Google AdMob."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  geolocator: ^13.0.1
  geocoding: ^4.0.0
  sensors_plus: ^6.1.0
  google_mobile_ads: ^9.2.0
  permission_handler: ^11.3.1
  intl: ^0.19.0
  gal: ^2.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.3
  ffmpeg_kit_flutter_new: ^4.6.8
  video_player: ^2.9.0
  in_app_review: ^2.0.9
  pdf: ^3.11.1
  native_exif: ^0.6.0
  open_filex: ^4.5.0
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/GPS Camera App Icon.png"
  adaptive_icon_background: "#1A73E8"
  adaptive_icon_foreground: "assets/icon/GPS Camera App Icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
